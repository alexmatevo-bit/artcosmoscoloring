  <style>
    /* === Carrusel Top 9 tipo Netflix === */
    :root{
      --cols: 3;           /* visibles */
      --gap: 28px;         /* separación entre cards */
      --arrow-size: 44px;  /* diámetro botón flecha */
    }

    .top9-section{
      position: relative;
      padding: 30px 0 60px;
      overflow: hidden;
    }

    .top9-section .section-title{ margin-bottom: 16px; }

    /* Viewport desplazable */
    .top9-viewport{
      position: relative;
      overflow-x: auto;
      overflow-y: visible;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0;                   /* para no cortar sombras */
      scrollbar-width: none;            /* Firefox */
    }
    .top9-viewport::-webkit-scrollbar{ display:none; }  /* Chrome/Safari */

    /* Pista */
    .top9-track{
      display: flex;
      gap: var(--gap);
      counter-reset: rank;              /* 1..9 automáticos */
      padding: 6px 56px;                /* margen para que no tape la flecha */
    }

    /* Card */
    .top9-card{
      position: relative;
      flex: 0 0 calc((100% - var(--gap) * (var(--cols) - 1)) / var(--cols));
      scroll-snap-align: start;
      text-align: center;
      counter-increment: rank;
    }

    /* Número gigante estilo Netflix detrás de la portada */
    .top9-card::before{
      content: counter(rank);
      position: absolute;
      left: -18px; top: -28px;
      font-weight: 900;
      font-size: clamp(110px, 16vw, 200px);
      line-height: .85;
      color: transparent;
      -webkit-text-stroke: 12px rgba(0,0,0,.10);
      opacity: .65;
      z-index: 0;
      pointer-events: none;
    }

    /* Portada */
    .top9-card .cover{
      display: inline-block;
      text-decoration: none;
      color: inherit;
      position: relative;
      z-index: 1; /* delante del número */
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .top9-card .cover:hover{
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0,0,0,.18);
    }
    .top9-card .cover img{
      display:block;
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:22px;
      max-width: 320px; /* límite visual */
    }

    .top9-card h3{ margin-top:14px; font-weight:800; }
    .top9-card p { margin-top: 6px; font-weight:700; }

    /* Botones flecha */
    .top9-arrow{
      position: absolute;
      top: 46%;
      transform: translateY(-50%);
      width: var(--arrow-size);
      height: var(--arrow-size);
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 0;
      background: rgba(0,0,0,.55);
      color: #fff;
      cursor: pointer;
      z-index: 3;
      transition: background .15s ease, opacity .15s ease;
    }
    .top9-arrow:hover{ background: rgba(0,0,0,.75); }
    .top9-arrow[disabled]{ opacity:.35; cursor: default; }

    .top9-arrow.prev{ left: 10px; }
    .top9-arrow.next{ right: 10px; }

    .top9-arrow svg{ width: 22px; height: 22px; }

    /* Gradientes laterales sutiles (como Netflix) */
    .top9-fade{
      position:absolute; top:0; bottom:0; width:56px; z-index:2; pointer-events:none;
      background: linear-gradient(to right, rgba(255,255,255,1), rgba(255,255,255,0));
    }
    .top9-fade.right{ right:0; transform: scaleX(-1); }
    .top9-fade.left{ left:0; }

    /* Responsive: 2 en tablet, 1 en móvil */
    @media (max-width: 1024px){ :root{ --cols: 2; } }
    @media (max-width: 640px){
      :root{ --cols: 1; }
      .top9-card::before{ left:-10px; top:-22px; -webkit-text-stroke:8px rgba(0,0,0,.10); }
    }
  </style>
</head>

  <!-- Carga header/footer (como ya usas) -->

<!-- Lógica del carrusel (flechas, teclado, loop) -->
<script>
(function () {
  const vp    = document.getElementById('top9Viewport');
  const prev  = document.querySelector('.top9-arrow.prev');
  const next  = document.querySelector('.top9-arrow.next');
  const track = vp && vp.querySelector('.top9-track');
  if (!vp || !prev || !next || !track) return;

  // Números 1..9 (tu CSS usa data-rank)
  const cards = Array.from(track.children);
  cards.forEach((el, i) => el.setAttribute('data-rank', String(i + 1)));

  const PAGES = 3;    // 1–3, 4–6, 7–9
  let page = 0;       // 0..2
  let startB = 0;     // x del primer card (con centrado aplicado)
  let step   = 0;     // ancho real de una página (3 cards)

  // Medida robusta: usa posiciones reales (evita redondeos/gap raros)
  function measure() {
    const c0 = cards[0];
    const c3 = cards[3]; // inicio de la página 2 (4–6)
    startB = c0 ? c0.offsetLeft : 0;
    if (c0 && c3) {
      step = c3.offsetLeft - c0.offsetLeft; // distancia entre 1 y 4
    } else {
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      step = ((cards[0]?.offsetWidth || 0) + gap) * 3;
    }
  }

  function goto(p, smooth) {
    page = ((p % PAGES) + PAGES) % PAGES;
    const target = startB + page * step;
    vp.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
  }
  function nextPage(){ goto(page + 1, true); }
  function prevPage(){ goto(page - 1, true); }

  prev.addEventListener('click', prevPage);
  next.addEventListener('click', nextPage);

  // Teclado ← →
  window.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prevPage(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
  });

  // Swipe
  let downX = 0, dragging = false;
  vp.addEventListener('pointerdown', (e)=>{ dragging = true;  downX = e.clientX; });
  vp.addEventListener('pointerup',   (e)=>{
    if (!dragging) return; dragging = false;
    const dx = e.clientX - downX;
    if (Math.abs(dx) > 40) { dx < 0 ? nextPage() : prevPage(); }
    else { goto(page, true); }
  });
  vp.addEventListener('pointercancel', ()=>{ dragging = false; });

  // === Init robusto: espera a header/footer y fuerza SIEMPRE 1–3 ===
  function initFirstPage() {
    measure();
    goto(0, false);              // SIEMPRE arranca en 1–3
    prev.disabled = false;
    next.disabled = false;
  }

  // Lánzalo en load, pageshow y tras inyectar header/footer
  function scheduleInit() {
    // ejecuta varias veces por si el layout cambia tras el fetch()
    initFirstPage();
    requestAnimationFrame(initFirstPage);
    setTimeout(initFirstPage, 100);
    setTimeout(initFirstPage, 300);
  }

  window.addEventListener('load', scheduleInit);
  window.addEventListener('pageshow', scheduleInit);

  // Observa cambios en #header y #footer (cuando se insertan con fetch)
  const header = document.getElementById('header');
  const footer = document.getElementById('footer');
  if (header) new MutationObserver(scheduleInit).observe(header, { childList:true, subtree:true });
  if (footer) new MutationObserver(scheduleInit).observe(footer, { childList:true, subtree:true });

  // Mantén página al redimensionar
  window.addEventListener('resize', () => {
    const p = page;
    measure();
    goto(p, false);
  });
})();

</script>
