    .gallery {
      margin: 0;

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      justify-items: center;

      aspect-ratio: 1 / 1;

      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border: 2px solid black;

    .book-card img:hover {

    .view-more-container {
      text-align: center;
      margin-top: 30px;
    }
    .view-more-btn {
      background-color: #f5e4d7; /* beige */
      color: black;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .view-more-btn:hover {
      background-color: #e3d1c4;
    }

<script>
  // Mostrar imágenes progresivamente
  const cards = document.querySelectorAll(".book-card");
  const btn = document.getElementById("view-more-btn");
  let index = 0;
  const step = 12; // cuántas mostrar cada vez

  function showImages() {
    for (let i = index; i < index + step && i < cards.length; i++) {
      cards[i].style.display = "block";
    }
    index += step;
    if (index >= cards.length) {
      btn.style.display = "none"; // esconder botón cuando ya no hay más
    }
  }

  // Inicial: mostrar las primeras 12
  showImages();

  // Evento del botón
  btn.addEventListener("click", showImages);
</script>

<!-- ======== LIGHTBOX ======== -->
<div class="lightbox" id="lightbox">
  <span class="close" id="closeBtn">&times;</span>
  <span class="arrow left" id="prev">&#10094;</span>
  <img id="lightboxImg" src="" data-link="">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<style>
/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 20px;
  cursor: pointer;
}
/* Botón cerrar */
.close {
  position: absolute;
  top: 20px; right: 30px;
  font-size: 40px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}
/* Flechas */
.arrow {
  position: absolute;
  top: 50%;
  font-size: 60px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  user-select: none;
}
.arrow.left { left: 20px; }
.arrow.right { right: 20px; }
</style>

<script>
const images = document.querySelectorAll('.book-card img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let currentIndex = 0;

// Mostrar imagen en lightbox
function showImage(index) {
  const img = images[index];
  lightboxImg.src = img.src;
  lightboxImg.setAttribute("data-link", img.dataset.link || "#");
  currentIndex = index;
  lightbox.classList.add('active');
}

// Abrir lightbox
images.forEach((img, index) => {
  img.addEventListener('click', () => showImage(index));
});

// Cerrar con la ❌
closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));

// Cerrar clicando fuera
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.classList.remove('active');
});

// Flechas
prevBtn.addEventListener('click', () => {
  showImage((currentIndex - 1 + images.length) % images.length);
});
nextBtn.addEventListener('click', () => {
  showImage((currentIndex + 1) % images.length);
});

// Clic en imagen grande → ir a la libreta en la misma pestaña
lightboxImg.addEventListener('click', () => {
  const link = lightboxImg.getAttribute('data-link');
  if (link && link !== '#') {
    window.location.href = link;  // ← en vez de window.open(..., "_blank")
  }
});


// Navegación teclado
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'Escape') closeBtn.click();
});

// Swipe en móvil/tablet
let startX = 0;
lightboxImg.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
lightboxImg.addEventListener('touchend', (e) => {
  let endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) nextBtn.click(); // deslizar izquierda
  if (endX - startX > 50) prevBtn.click(); // deslizar derecha
});
</script>
